name: kontrol

# Her itme ve her PR'da koşar. Üç iş bağımsız: biri düşünce diğerleri
# yine de sonuç verir, böylece tek koşuda tüm sorunları görürüz.
#
# Koşucu imajı **sabit**: `ubuntu-latest` etiketi 19 Ekim 2026'dan
# itibaren Ubuntu 26'ya taşınıyor. Etiketi kullanmak, kimse bir şey
# değiştirmeden bir gün ortamın değişmesi demek — yeşilden kırmızıya
# geçişin sebebini aramakla vakit kaybedilir. Yükseltmek bir karar
# olsun: bu satırı değiştirip CI'ın ne dediğine bakarız.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  FLUTTER_VERSION: "3.50.0"

jobs:
  api:
    name: API (ruff · mypy · pytest + PostgreSQL)
    runs-on: ubuntu-24.04

    # Veritabanı testleri gerçek PostgreSQL ister. Sağlayıcıya özel bir
    # şey kullanmadığımız için sade bir postgres imajı yetiyor — bu aynı
    # zamanda ADR-0012 md.4'ün (taşınabilirlik) sürekli sınanmasıdır.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: talimatname_owner
          POSTGRES_PASSWORD: ci_parolasi
          POSTGRES_DB: talimatname
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U talimatname_owner -d talimatname"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://talimatname_owner:ci_parolasi@localhost:5432/talimatname
      ENVIRONMENT: test

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Yazı tipi (kanıt damgası)
        # Damga Türkçe harf çizebilen bir yazı tipi ister (ST-040);
        # gömülü yazı tipinde ş/ğ/İ yok. Üretim imajında da gerekiyor,
        # bu yüzden burada **açıkça** kuruyoruz: koşucunun imajında
        # ne olduğuna güvenmek, sessizce damgasız kalmak demekti.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core
        working-directory: .

      - name: Bağımlılıklar
        run: pip install -e ".[dev]"

      - name: Biçim ve lint
        run: |
          python -m ruff format --check .
          python -m ruff check .

      - name: Tip denetimi
        run: python -m mypy

      - name: Göç ileri → geri → ileri
        # ADR-0014 md.11: göç geriye de çalışmalı. Boş veritabanında
        # bunu ölçmek ucuz; üretimde geri dönüş gerektiğinde pahalı.
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head

      - name: Tohum (idempotent olmalı)
        run: |
          python -m talimatname.seed
          python -m talimatname.seed

      - name: Testler (veritabanı testleri dahil)
        run: python -m pytest -q --cov=talimatname.domain --cov-report=term-missing

      - name: OpenAPI sözleşmesi güncel mi
        # Üretilmiş sözleşme depoda duruyor; koddan yeniden üretip
        # karşılaştırıyoruz. Fark varsa sözleşme kaymış demektir.
        run: |
          python - <<'PY'
          import json
          from talimatname.api.app import create_app
          from talimatname.settings import Settings
          app = create_app(Settings(database_url=None))
          with open("../spec/openapi.json", "w", encoding="utf-8") as f:
              json.dump(app.openapi(), f, ensure_ascii=False, indent=2)
          PY
          git diff --exit-code ../spec/openapi.json \
            || (echo "::error::spec/openapi.json güncel değil: api içinde yeniden üretip commit edin" && exit 1)

  web:
    name: Panel (tsc · eslint · vitest · build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Bağımlılıklar
        run: npm ci

      - name: Biçim
        run: npx prettier --check src

      - name: Lint
        run: npm run lint

      - name: Tip denetimi
        run: npx tsc -b

      - name: Testler
        run: npm test

      - name: Derleme
        run: npm run build

      - name: Üretilmiş istemci tipleri güncel mi
        # ADR-0014 md.10: istemci OpenAPI'den üretilir, elle yazılmaz.
        run: |
          npm run api:tipler
          git diff --exit-code src/api/schema.ts \
            || (echo "::error::src/api/schema.ts güncel değil: npm run api:tipler çalıştırıp commit edin" && exit 1)

  mobil:
    name: Saha istemcisi (analyze · test · APK)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bağımlılıklar
        run: flutter pub get

      - name: Biçim
        run: dart format --output=none --set-exit-if-changed .

      - name: Analiz
        run: flutter analyze

      - name: Testler
        # Token testi ../web/src/styles/tokens.css okuyor: iki istemci
        # aynı tasarım sisteminden sapamasın diye (mobile/README).
        run: flutter test

      - name: Üretilmiş kod güncel mi
        # Drift tabloları koddan üretiliyor; üretilmiş dosya depoda
        # duruyor (ADR-0014 md.10 ile aynı kural: üretilmiş sözleşme
        # commit'lenir ve CI tazeliğini doğrular).
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code lib/queue/database.g.dart             || (echo "::error::database.g.dart güncel değil: build_runner çalıştırıp commit edin" && exit 1)

      - name: Android derlemesi
        run: flutter build apk --debug

  fikstur:
    name: Ortak fikstürler (kural motoru sözleşmesi)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Fikstür dosyaları geçerli JSON mu
        # spec/ iki istemcinin ortak sözleşmesi (ADR-0014 md.3).
        # Flutter tarafı Faz B'de aynı dosyaları okuyacak; bozuk JSON
        # buraya hiç girmesin.
        run: |
          python - <<'PY'
          import json, pathlib, sys
          hata = 0
          for yol in sorted(pathlib.Path("spec").rglob("*.json")):
              try:
                  json.loads(yol.read_text(encoding="utf-8"))
                  print("ok", yol)
              except Exception as e:
                  print("BOZUK", yol, e); hata = 1
          sys.exit(hata)
          PY

  dagitim:
    name: Dağıtım (imajlar · compose dumanı)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Ortam dosyası (yalnızca CI için üretilen anahtarlar)
        # Gerçek anahtar yok: her koşuda yenisi üretiliyor. Üretim
        # anahtarları ücretsiz/AB ortama hiç inmez (ADR-0012).
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out ozel.pem 2>/dev/null
          openssl rsa -in ozel.pem -pubout -out acik.pem 2>/dev/null
          python - <<'PY'
          import pathlib, secrets

          # PEM tek satıra indiriliyor: Compose'un `.env` çözümleyicisi
          # çok satırlı değer kabul etmiyor. Kaçışı uygulama tarafında
          # Settings._pem_satirlari geri açıyor.
          def tek_satir(ad: str) -> str:
              return pathlib.Path(ad).read_text().strip().replace("\n", r"\n")

          pathlib.Path(".env").write_text(
              "ENVIRONMENT=staging\n"
              f"POSTGRES_PASSWORD={secrets.token_hex(16)}\n"
              f"OBJECT_STORE_SECRET_KEY={secrets.token_hex(16)}\n"
              f"JWT_PRIVATE_KEY={tek_satir('ozel.pem')}\n"
              f"JWT_PUBLIC_KEY={tek_satir('acik.pem')}\n",
              encoding="utf-8",
          )
          PY
          rm ozel.pem acik.pem

      - name: Ortam dosyası Compose tarafından okunabiliyor mu
        # Çok satırlı bir değer buraya sızarsa `docker compose build`
        # ayrıştırma hatasıyla düşer; hatayı kaynağında yakalıyoruz.
        run: |
          docker compose config -q
          awk '!/^[A-Z_]+=./ {print "BOZUK SATIR " NR ": " $0; hata=1} END {exit hata}' .env

      - name: İmajları kur
        run: docker compose build

      - name: Yığını ayağa kaldır
        run: |
          docker compose up -d postgres minio
          docker compose run --rm goc
          docker compose run --rm tohum
          docker compose up -d api zamanlayici web

      - name: Sağlık ve panel yanıt veriyor mu
        # Dağıtımın gerçek sorusu: temiz bir makinede açılıyor mu.
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/v1/health > /tmp/saglik.json; then break; fi
            sleep 2
          done
          cat /tmp/saglik.json
          grep -q '"database_configured":true' /tmp/saglik.json
          grep -q '"object_store_configured":true' /tmp/saglik.json
          curl -fsS http://localhost:8080/ | grep -qi "talimatname"

      - name: Zamanlayıcı turu koştu mu
        # Ürünün zamana bağlı yarısı bu süreçte: ayakta değilse
        # pencere açılışı, hatırlatma, eskalasyon ve damga çalışmaz.
        run: |
          sleep 15
          docker compose logs zamanlayici | tail -20
          docker compose logs zamanlayici | grep -q "zamanlayici.tur"

      - name: Belirteç anahtarı .env'den geçerli geldi mi
        # `.env` tek satırlık olduğu için PEM kaçışla yazılıyor.
        # Kaçış çözülmezse anahtar geçersiz PEM olur ve ilk oturum
        # açışta patlar. Kabın aldığı anahtarla imza üretip aynı
        # belirteci HTTP üzerinden doğruluyoruz.
        run: |
          docker compose exec -T api python - > cikti.txt <<'PY'
          from datetime import timedelta

          from talimatname.infra.memory import sabit_id
          from talimatname.services import tokens
          from talimatname.services.auth import SCOPE
          from talimatname.settings import get_settings

          ayar = get_settings()
          ozel = ayar.jwt_private_key or ""
          assert "BEGIN" in ozel, "JWT_PRIVATE_KEY kaba ulasmadi"
          assert chr(10) in ozel, "PEM tek satir kalmis: kacis cozulmemis"
          konu = str(sabit_id("kullanici:+905321110001"))
          belirtec = tokens.imzala(
              ayar, subject=konu, scope=SCOPE, ttl=timedelta(minutes=5)
          )
          print("BELIRTEC:" + belirtec)
          PY
          BELIRTEC=$(sed -n 's/^BELIRTEC://p' cikti.txt | head -1)
          test -n "$BELIRTEC"
          curl -fsS -H "Authorization: Bearer $BELIRTEC" http://localhost:8080/api/v1/auth/me > ben.json
          cat ben.json
          grep -q 905321110001 ben.json
          rm cikti.txt ben.json

      - name: Kanıt kovası gerçekten S3'te mi
        run: |
          docker compose exec -T api python - <<'PY'
          import time

          from talimatname.api.bagimliliklar import _nesne_deposu

          # Kova servisi yığının en yavaş parçası olabilir: adaptör
          # ilk bağlanışta kovayı açıyor, birkaç saniye bekliyoruz.
          son_hata = None
          for _ in range(20):
              try:
                  depo = _nesne_deposu()
                  break
              except Exception as hata:  # noqa: BLE001
                  son_hata = hata
                  _nesne_deposu.cache_clear()
                  time.sleep(3)
          else:
              raise SystemExit(f"kovaya baglanilamadi: {son_hata}")

          print("adaptor:", type(depo).__name__)
          assert type(depo).__name__ == "S3ObjectStore", "yerel dizine dusmus"
          depo.put("ci/deneme.txt", b"merhaba")
          assert depo.get("ci/deneme.txt") == b"merhaba"
          depo.delete("ci/deneme.txt")
          print("kova yazma/okuma tamam")
          PY

      - name: Günlükler (hata olursa)
        if: failure()
        run: docker compose logs --tail 80

      - name: Kapat
        if: always()
        run: docker compose down -v
